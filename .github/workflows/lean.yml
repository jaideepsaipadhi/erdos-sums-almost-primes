# Builds the Lean development and audits it.
#
# Manual by default: this is a private repository, so Actions minutes are
# metered, and the build is long.  Mathlib comes from `lake exe cache get`;
# Banksmartin and Odd are always built from source, and the long pole in them
# is dConst_lower_bound_sharp, whose 668-element Finset product is minutes of
# norm_num on its own.  (An earlier version of this comment blamed
# PrimeNumberTheoremAnd for the build length.  It is not a dependency -- it is
# in neither lakefile.toml nor lake-manifest.json -- so that was never the
# reason.)  Run it from the Actions tab ("Run workflow"), or let it fire on a
# PR to main.
#
# What it establishes, which nothing else in this repository does:
#   * the development compiles against the pinned toolchain and manifest
#   * there is no `sorry` anywhere -- checked by the compiler, not by grep
#   * the odd-case axiom audit reports only propext, Classical.choice,
#     Quot.sound (odd-proof/axcheck.lean)
#
# The runner is pinned rather than `ubuntu-latest`, which migrates to Ubuntu 26
# on 2026-10-19: a green check should not change meaning underneath us.  The
# disk is reclaimed first because this build does not fit a stock runner:
# Mathlib's oleans plus this development came within a few hundred MB of the
# 14 GB image, which surfaced once as a `tar` failure saving the cache and once
# as an outright "No space left on device".
name: lean

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ~25 GB of preinstalled toolchains this build never touches.
      - name: Reclaim disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      # Toolchain and Mathlib cache only.  The build itself is the next step,
      # so that THIS workflow owns the log.
      - name: Toolchain and mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      # Build ONCE, keeping the output.  The previous arrangement let
      # lean-action build and then, on failure, ran `lake build` a SECOND time
      # to recover the error text, on the stated assumption that the re-run
      # would be "a cache hit, seconds".  That is false exactly when it
      # matters: if the failure is a Lean error in Banksmartin/Basic.lean or
      # Odd/Basic.lean, the second build re-elaborates the whole file, so the
      # recovery step takes as long as the build it is recovering from.  One
      # run of it sat for over forty minutes and produced no annotations at
      # all, which is worse than useless -- it holds a runner and reports
      # nothing.
      - name: lake build
        run: |
          set +e
          lake build 2>&1 | tee build.log
          echo "${PIPESTATUS[0]}" > build.rc
          exit 0

      # The run-log host is unreachable from this project's tooling and
      # artifact upload is blocked too, so ANNOTATIONS are the only channel out
      # of the runner.  They are capped (~15 per check) and long lines get
      # truncated, so emit FEW and SHORT: the old step echoed up to 120, which
      # overran the cap and dropped the first error -- the one that matters --
      # while keeping forty lines of tail.
      - name: Report build result
        run: |
          rc=$(cat build.rc)
          echo "::notice::build rc=${rc}"
          if [ "${rc}" != "0" ]; then
            # Lean's messages run over several lines -- "Application type
            # mismatch: The argument" says nothing without the lines that
            # follow it -- so take two lines of context, not just the match.
            grep -nE -A2 "error:" build.log | head -12 \
              | cut -c1-240 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            n=$(grep -cE "error:" build.log)
            echo "::error::total lines matching 'error:' = ${n}"
            exit 1
          fi

      # Compiler-reported, not text-matched.  A grep for the word finds it in
      # comments and docstrings; Lean emits "declaration uses 'sorry'" only for
      # the real thing.  The rebuild here is a cache hit and costs seconds.
      - name: No sorry (compiler-reported)
        run: |
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::the compiler reports a declaration using sorry"
            grep -n "declaration uses 'sorry'" build.log
            exit 1
          fi
          echo "compiler reports no declaration using sorry"

      - name: Disk after build
        if: always()
        run: df -h / | tail -1

      # A green `lake build` says something compiled, not that a PARTICULAR
      # theorem is clean -- an errored declaration still reports as sorryAx to
      # its dependents.  These audits are what make "green" mean "verified"
      # for the named theorems, which matters because the run log and the
      # artifact blob host are both unreachable from the dev container: the
      # build itself has to do the checking.
      - name: Axiom audit (unrestricted case)
        run: |
          # `lean | tee` reports TEE's status, so lean's own exit code is lost
          # and an unknown constant in the audit file would pass silently.
          # Capture lean's exit status explicitly.  `lean | tee` reports TEE's
          # status, so an error in the audit file passed silently; `pipefail`
          # fixed that but then aborts before any diagnostic can print, which
          # is just as blind.  This way the status and the output are both in
          # hand before anything is decided.
          set +e
          lake env lean axcheck-bm.lean > axioms-bm.txt 2>&1
          rc=$?
          set -e
          cat axioms-bm.txt
          echo "::notice::bm lean exit status ${rc}"
          if [ "$rc" -ne 0 ]; then
            # Select by CONTENT, never by position.  Two earlier versions of
            # this step picked a positional window and both showed the wrong
            # thing.  Dumping every line overruns the ~15 annotation cap and
            # what survives is the clean `depends on axioms` prints; `tail -14`
            # was then written on the assumption that lean's error "comes
            # last", which is false: stderr is unbuffered and lands at the TOP
            # of the redirected file, while the buffered #print output flushes
            # at the END.  So the tail showed nine clean prints and dropped the
            # error -- an audit that reads as passing yet failed.  Annotations
            # are the ONLY channel out of this job (both the run-log host and
            # the artifact blob host are unreachable from the dev container),
            # so the filter is the thing that has to be right.
            echo "::error::bm axiom audit: lean exited ${rc}"
            grep -nEi "error|unknown|failed|sorry|timeout|heartbeat|maximum" \
                 axioms-bm.txt | head -8 | cut -c1-240 \
              | while IFS= read -r line; do echo "::error::bm! ${line}"; done
            # How many of the audited names DID resolve.  This separates "the
            # module loaded and one constant is missing" from "almost nothing
            # loaded", which the error text alone does not distinguish.
            nres=$(grep -c 'depend' axioms-bm.txt); nwant=$(grep -c '^#print axioms' axcheck-bm.lean)
            echo "::error::bm? resolved ${nres} of ${nwant} audited names"
            # For every `Unknown constant`, say whether the SOURCE declares it.
            # An audited name that no source declares is an audit typo and is
            # fixed here; a name the source DOES declare but the olean lacks is
            # a build problem, not an audit problem, and must be chased there.
            # Without this split the two are indistinguishable from outside the
            # runner, which cost a full cycle of guessing once.
            grep -oE "Unknown constant [\`']?[A-Za-z_][A-Za-z0-9_'.]*" axioms-bm.txt \
              | sed -E "s/.*[\`' ]([A-Za-z_][A-Za-z0-9_'.]*)$/\1/" | sort -u | head -4 \
              | while IFS= read -r nm; do
                  if grep -qE "^(private )?(theorem|lemma|def|noncomputable def|structure|abbrev) ${nm}( |\(|\{|\[|:)" \
                       Banksmartin/Basic.lean Odd/Basic.lean; then
                    echo "::error::bm? ${nm}: DECLARED in source but absent from the olean -> build problem"
                  else
                    echo "::error::bm? ${nm}: not declared in any source -> audit lists a name that does not exist"
                  fi
                done
            # Emitting nothing is indistinguishable from the cap having eaten
            # the annotations, so when no line matches, say that explicitly and
            # show both ends rather than leaving the next reader to guess.
            if ! grep -qEi "error|unknown|failed|sorry" axioms-bm.txt; then
              echo "::error::bm! no error text in $(wc -l < axioms-bm.txt) lines"
              head -3 axioms-bm.txt | cut -c1-240 \
                | while IFS= read -r l; do echo "::error::bm! head: ${l}"; done
              tail -3 axioms-bm.txt | cut -c1-240 \
                | while IFS= read -r l; do echo "::error::bm! tail: ${l}"; done
            fi
            exit 1
          fi
          if grep -q "sorryAx" axioms-bm.txt; then
            echo "::error::sorryAx in the unrestricted axiom audit"
            exit 1
          fi
          if grep "depends on axioms" axioms-bm.txt \
             | grep -vE "\[propext, Classical\.choice, Quot\.sound\]"; then
            echo "::error::an unexpected axiom in the unrestricted audit"
            exit 1
          fi
          # Every #print axioms must have produced a line.  Annotations are
          # capped and partial, so counting here is the only way to tell
          # "reported clean" apart from "never reported" -- reading the
          # annotation list cannot distinguish truncation from absence.
          #
          # Count 'depend', not 'depends on axioms': an axiom-free declaration
          # prints "does not depend on any axioms", which the narrower pattern
          # misses.  Several of the rational-arithmetic lemmas here are
          # axiom-free, so the narrow count read 10 of 14 and failed a clean
          # audit.  The CONTENT guard above still keys on "depends on axioms",
          # which is correct: axiom-free is stricter than clean, not a miss.
          want=$(grep -c '^#print axioms' axcheck-bm.lean)
          got=$(grep -c 'depend' axioms-bm.txt)
          echo "expected ${want} axiom lines, got ${got}"
          if [ "$want" -ne "$got" ]; then
            echo "::error::unrestricted audit printed ${got} of ${want} lines"
            # Capped, and the NON-reporting lines are the informative ones, so
            # show what is not a clean print rather than the whole file.
            grep -vE "depend" axioms-bm.txt | head -8 | cut -c1-240 \
              | while IFS= read -r line; do echo "::error::bm? ${line}"; done
            exit 1
          fi
          echo "::notice::unrestricted axiom audit clean: ${got}/${want} declarations"
          echo "unrestricted axiom audit clean: ${got}/${want}"

      - name: Axiom audit (odd case)
        run: |
          # Capture lean's exit status explicitly.  `lean | tee` reports TEE's
          # status, so an error in the audit file passed silently; `pipefail`
          # fixed that but then aborts before any diagnostic can print, which
          # is just as blind.  This way the status and the output are both in
          # hand before anything is decided.
          set +e
          lake env lean odd-proof/axcheck.lean > axioms.txt 2>&1
          rc=$?
          set -e
          cat axioms.txt
          echo "::notice::odd lean exit status ${rc}"
          if [ "$rc" -ne 0 ]; then
            # Content-selected, capped; see the unrestricted step above for why
            # a positional window cannot be trusted here.
            echo "::error::odd axiom audit: lean exited ${rc}"
            grep -nEi "error|unknown|failed|sorry|timeout|heartbeat|maximum" \
                 axioms.txt | head -8 | cut -c1-240 \
              | while IFS= read -r line; do echo "::error::odd! ${line}"; done
            if ! grep -qEi "error|unknown|failed|sorry" axioms.txt; then
              echo "::error::odd! no error text in $(wc -l < axioms.txt) lines"
              head -3 axioms.txt | cut -c1-240 \
                | while IFS= read -r l; do echo "::error::odd! head: ${l}"; done
              tail -3 axioms.txt | cut -c1-240 \
                | while IFS= read -r l; do echo "::error::odd! tail: ${l}"; done
            fi
            exit 1
          fi
          want=$(grep -c '^#print axioms' odd-proof/axcheck.lean)
          got=$(grep -c 'depend' axioms.txt)
          echo "expected ${want} axiom lines, got ${got}"
          if [ "$want" -ne "$got" ]; then
            echo "::error::odd audit printed ${got} of ${want} lines"
            grep -vE "depend" axioms.txt | head -8 | cut -c1-240 \
              | while IFS= read -r line; do echo "::error::odd? ${line}"; done
            exit 1
          fi
          if grep -q "sorryAx" axioms.txt; then
            echo "::error::sorryAx appears in the axiom audit"
            exit 1
          fi
          # every reported line must be exactly the three permitted axioms
          if grep "depends on axioms" axioms.txt \
             | grep -vE "\[propext, Classical\.choice, Quot\.sound\]"; then
            echo "::error::an unexpected axiom was reported"
            exit 1
          fi
          echo "::notice::odd axiom audit clean: ${got}/${want} declarations"
          echo "axiom audit clean"

      # The run log is served from a host this project's tooling cannot reach,
      # so annotations were the only readable channel -- and they are capped
      # and partial.  Reading them and inferring "no error reported" is not
      # the same as "it compiled": a missing DecidableEq instance in #24 sat
      # in a probe whose output never became an annotation at all.  Artifacts
      # ARE fetchable over the API, so the full log goes into one.
      - name: Collect logs
        if: always()
        run: |
          lake build > full-build.log 2>&1 || true
          ls -la *.log *.txt 2>/dev/null || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-reports
          path: |
            axioms.txt
            axioms-bm.txt
            full-build.log
            build.log
            relog.txt
          if-no-files-found: warn
